<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperion WarRoom — Ops Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0b0e14;
      --surface:   #141820;
      --surface2:  #1c2130;
      --border:    #2a3146;
      --accent:    #4f8ef7;
      --accent2:   #6ee7b7;
      --danger:    #f87171;
      --warn:      #fbbf24;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    10px;
      --font:      'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: .02em; }
    header h1 span { color: var(--accent2); }
    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .nav-btn:hover { color: var(--text); border-color: var(--accent); }
    .nav-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }

    main {
      width: 100%;
      max-width: 1100px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- Cards & Panels --- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* --- Forms & Inputs --- */
    label { font-size: .8rem; color: var(--muted); display: block; margin-bottom: 4px; margin-top: 10px; }
    input[type="text"], select, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 8px 12px;
      font-size: .85rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .8rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 7px;
      border: none;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn:not(:disabled):hover { filter: brightness(1.12); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--accent2); color: #0b0e14; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .btn-row { margin-top: 14px; display: flex; gap: 8px; }

    /* --- Tools Grid / List --- */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .tool-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tool-name { font-weight: 700; font-size: .95rem; color: var(--text); }
    .tool-method {
      font-size: .72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e3a5f;
      color: var(--accent);
      text-transform: uppercase;
    }
    .tool-url { font-family: monospace; font-size: .78rem; color: var(--muted); word-break: break-all; }
    .tool-desc { font-size: .8rem; color: #a0aec0; }
    .tool-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }

    /* --- Headers Editor --- */
    .headers-table {
      width: 100%;
      margin-top: 6px;
      border-collapse: collapse;
    }
    .headers-table td { padding: 4px 2px; }

    /* --- Incidents Table --- */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }
    .data-table th, .data-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .data-table th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
    .data-table tr:hover { background: var(--surface2); }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .pill-green  { background: #064e3b; color: var(--accent2); }
    .pill-yellow { background: #451a03; color: var(--warn); }
    .pill-blue   { background: #1e3a5f; color: var(--accent); }

    /* --- Log Output --- */
    .log-container {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      min-height: 400px;
      max-height: 600px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: .82rem;
      line-height: 1.6;
    }
    .log-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #1e293b; }
    .log-time { color: var(--muted); font-size: .75rem; }
    .log-type { font-weight: 700; color: var(--accent); }
    .log-query { color: var(--accent2); }
    .log-tool { color: var(--warn); }
    .log-reply { color: var(--text); }

    .hidden { display: none !important; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%; max-width: 550px;
      padding: 1.5rem;
    }

    /* Live viewer iframe */
    #viewer-container {
      margin-top: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    #viewer-frame {
      width: 100%;
      height: 450px;
      border: none;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-icon">&#9889;</div>
  <h1>Hyperion <span>Ops Dashboard</span></h1>
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('tools')">🛠 Tools Registry</button>
    <button class="nav-btn" onclick="switchTab('incidents')">🚨 Incidents</button>
    <button class="nav-btn" onclick="switchTab('logs')">🤖 Agent Log Feed</button>
  </div>
</header>

<main>

  <!-- ==================== TAB 1: TOOLS REGISTRY ==================== -->
  <div id="tab-tools" class="tab-content active">
    <div class="panel">
      <div class="panel-title">
        <span>Registered HTTP Tools</span>
        <button class="btn btn-primary" onclick="openToolModal()">+ Add New Tool</button>
      </div>
      <p style="font-size:.83rem;color:var(--muted);margin-bottom:1rem;">
        These tools are dynamically exposed to the <code>"Hey Agent"</code> LLM during live calls.
      </p>

      <div id="tools-list" class="tools-grid">
        <!-- Tool cards dynamically populated -->
      </div>
    </div>
  </div>

  <!-- ==================== TAB 2: INCIDENTS ==================== -->
  <div id="tab-incidents" class="tab-content">
    <div class="panel">
      <div class="panel-title">
        <span>Active & Past Incident Sessions</span>
        <button class="btn btn-ghost" onclick="loadIncidents()">↻ Refresh List</button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Incident ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Bot Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="incidents-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>

      <div id="viewer-container" class="hidden">
        <div style="padding: 8px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size:.8rem; font-weight:700;">Live Incident Viewer</span>
          <button class="btn btn-ghost" style="padding:2px 8px; font-size:.75rem;" onclick="closeViewer()">✕ Close</button>
        </div>
        <iframe id="viewer-frame" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <!-- ==================== TAB 3: AGENT LOG FEED ==================== -->
  <div id="tab-logs" class="tab-content">
    <div class="panel">
      <div class="panel-title">
        <span>Real-Time "Hey Agent" Command Feed</span>
        <span id="log-ws-status" style="font-size:.78rem; color:var(--muted);">Connecting...</span>
      </div>
      <div id="agent-log-output" class="log-container">
        <!-- Log entries stream here -->
      </div>
    </div>
  </div>

</main>

<!-- ==================== TOOL ADD / EDIT MODAL ==================== -->
<div id="tool-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-title" style="margin-bottom:1rem;">Add Tool</h3>

    <input type="hidden" id="tool-id" />
    <label for="tool-name">Tool Name</label>
    <input type="text" id="tool-name" placeholder="e.g. vercel_restart_prod" />

    <label for="tool-desc">Description (What does it do?)</label>
    <input type="text" id="tool-desc" placeholder="e.g. Restarts the production Vercel server deployment" />

    <label for="tool-method">HTTP Method</label>
    <select id="tool-method">
      <option value="POST">POST</option>
      <option value="GET">GET</option>
      <option value="PUT">PUT</option>
      <option value="DELETE">DELETE</option>
    </select>

    <label for="tool-url">Target Endpoint URL</label>
    <input type="text" id="tool-url" placeholder="https://api.vercel.com/v13/deployments/redeploy" />

    <label>Request Headers</label>
    <table class="headers-table" id="headers-table">
      <!-- Key/Value rows added here -->
    </table>
    <button class="btn btn-ghost" style="margin-top:6px; font-size:.75rem;" onclick="addHeaderRow()">+ Add Header</button>

    <label for="tool-body">Body Template (JSON string, optional)</label>
    <textarea id="tool-body" rows="3" placeholder='{"target": "production"}'></textarea>

    <div class="btn-row" style="margin-top:1.25rem;">
      <button class="btn btn-primary" onclick="saveTool()">Save Tool</button>
      <button class="btn btn-ghost" onclick="closeToolModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';

  // --- Tab Switching ---
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    event.target.classList.add('active');

    if (tabId === 'tools') loadTools();
    if (tabId === 'incidents') loadIncidents();
  }

  // --- Tools Registry logic ---
  async function loadTools() {
    try {
      const res = await fetch(`${API}/api/tools`);
      const tools = await res.json();
      const container = document.getElementById('tools-list');
      if (!tools.length) {
        container.innerHTML = `<div style="grid-column: 1/-1; color: var(--muted); font-size: .88rem; padding: 2rem; text-align: center;">No tools registered yet. Click "+ Add New Tool" to create one.</div>`;
        return;
      }
      container.innerHTML = tools.map(t => `
        <div class="tool-card">
          <div class="tool-header">
            <span class="tool-name">${escapeHtml(t.name)}</span>
            <span class="tool-method">${t.method}</span>
          </div>
          <div class="tool-url">${escapeHtml(t.url)}</div>
          <div class="tool-desc">${escapeHtml(t.description || 'No description provided.')}</div>
          <div class="tool-actions">
            <button class="btn btn-ghost" style="font-size:.75rem; padding:4px 8px;" onclick="testTool('${t.id}')">⚡ Test</button>
            <button class="btn btn-ghost" style="font-size:.75rem; padding:4px 8px;" onclick="editTool('${t.id}')">✏️ Edit</button>
            <button class="btn btn-danger" style="font-size:.75rem; padding:4px 8px; margin-left:auto;" onclick="deleteTool('${t.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    } catch(e) {
      console.error('Failed to load tools', e);
    }
  }

  function openToolModal(tool = null) {
    document.getElementById('tool-id').value = tool ? tool.id : '';
    document.getElementById('tool-name').value = tool ? tool.name : '';
    document.getElementById('tool-desc').value = tool ? tool.description : '';
    document.getElementById('tool-method').value = tool ? tool.method : 'POST';
    document.getElementById('tool-url').value = tool ? tool.url : '';
    document.getElementById('tool-body').value = tool ? (tool.body_template || '') : '';
    document.getElementById('modal-title').textContent = tool ? 'Edit Tool' : 'Add New Tool';

    const table = document.getElementById('headers-table');
    table.innerHTML = '';
    const headers = tool ? (tool.headers || {}) : {};
    if (Object.keys(headers).length === 0) {
      addHeaderRow('Authorization', 'Bearer token_here');
    } else {
      Object.entries(headers).forEach(([k, v]) => addHeaderRow(k, v));
    }

    document.getElementById('tool-modal').classList.remove('hidden');
  }

  function closeToolModal() {
    document.getElementById('tool-modal').classList.add('hidden');
  }

  function addHeaderRow(key = '', val = '') {
    const table = document.getElementById('headers-table');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="hdr-key" placeholder="Header Name" value="${escapeHtml(key)}" /></td>
      <td><input type="text" class="hdr-val" placeholder="Value" value="${escapeHtml(val)}" /></td>
      <td style="width:24px;"><button class="btn btn-ghost" style="padding:2px 6px; color:var(--danger);" onclick="this.closest('tr').remove()">✕</button></td>
    `;
    table.appendChild(row);
  }

  async function saveTool() {
    const id = document.getElementById('tool-id').value;
    const name = document.getElementById('tool-name').value.trim();
    const description = document.getElementById('tool-desc').value.trim();
    const method = document.getElementById('tool-method').value;
    const url = document.getElementById('tool-url').value.trim();
    const body_template = document.getElementById('tool-body').value.trim() || null;

    const headers = {};
    document.querySelectorAll('#headers-table tr').forEach(tr => {
      const k = tr.querySelector('.hdr-key').value.trim();
      const v = tr.querySelector('.hdr-val').value.trim();
      if (k) headers[k] = v;
    });

    if (!name || !url) {
      alert('Tool Name and Target URL are required!');
      return;
    }

    const payload = { name, description, method, url, headers, body_template };
    const method_http = id ? 'PUT' : 'POST';
    const endpoint = id ? `${API}/api/tools/${id}` : `${API}/api/tools`;

    try {
      const res = await fetch(endpoint, {
        method: method_http,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        closeToolModal();
        loadTools();
      } else {
        const err = await res.json();
        alert('Error: ' + (err.detail || 'Failed to save tool'));
      }
    } catch(e) {
      alert('Request error: ' + e.message);
    }
  }

  async function editTool(id) {
    const res = await fetch(`${API}/api/tools`);
    const tools = await res.json();
    const tool = tools.find(t => t.id === id);
    if (tool) openToolModal(tool);
  }

  async function deleteTool(id) {
    if (!confirm('Are you sure you want to delete this tool?')) return;
    await fetch(`${API}/api/tools/${id}`, { method: 'DELETE' });
    loadTools();
  }

  async function testTool(id) {
    alert('Firing live test request...');
    try {
      const res = await fetch(`${API}/api/tools/${id}/test`, { method: 'POST' });
      const result = await res.json();
      alert(`Test Result:\nOK: ${result.ok}\nStatus: ${result.status_code}\nResponse: ${result.response_text || result.error}`);
    } catch(e) {
      alert('Test failed: ' + e.message);
    }
  }

  // --- Incidents logic ---
  async function loadIncidents() {
    try {
      const res = await fetch(`${API}/api/incidents`);
      const incidents = await res.json();
      const tbody = document.getElementById('incidents-table-body');
      if (!incidents.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted); text-align:center;">No incidents recorded yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = incidents.map(inc => `
        <tr>
          <td><code>${inc.incident_id}</code></td>
          <td><strong>${escapeHtml(inc.name)}</strong></td>
          <td><span class="pill pill-green">${inc.status}</span></td>
          <td><span class="pill pill-blue">${inc.bot_status || 'none'}</span></td>
          <td>
            <button class="btn btn-ghost" style="font-size:.75rem; padding:4px 8px;" onclick="openViewer('${inc.incident_id}')">👁 Live View</button>
            ${inc.meet_url ? `<a href="${inc.meet_url}" target="_blank" class="btn btn-ghost" style="font-size:.75rem; padding:4px 8px; text-decoration:none;">📹 Meet</a>` : ''}
          </td>
        </tr>
      `).join('');
    } catch(e) {
      console.error('Failed to load incidents', e);
    }
  }

  function openViewer(id) {
    const container = document.getElementById('viewer-container');
    const iframe = document.getElementById('viewer-frame');
    iframe.src = `${API}/live/${id}`;
    container.classList.remove('hidden');
  }

  function closeViewer() {
    document.getElementById('viewer-container').classList.add('hidden');
    document.getElementById('viewer-frame').src = 'about:blank';
  }

  // --- Real-Time Agent Log Feed ---
  function initLogWS() {
    const statusEl = document.getElementById('log-ws-status');
    const logOutput = document.getElementById('agent-log-output');
    const wsUrl = API.replace(/^http/, 'ws') + '/ws/agent-log';

    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      statusEl.textContent = '● Connected to log stream';
      statusEl.style.color = 'var(--accent2)';
    };

    ws.onclose = () => {
      statusEl.textContent = '○ Log stream disconnected';
      statusEl.style.color = 'var(--muted)';
      setTimeout(initLogWS, 3000);
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const time = new Date().toLocaleTimeString();

      let html = '';
      if (data.type === 'wake_word_triggered') {
        html = `<div class="log-item">
          <span class="log-time">[${time}]</span> <span class="log-type">🗣 WAKE WORD DETECTED</span>
          <div class="log-query">Query: "${escapeHtml(data.query)}"</div>
        </div>`;
      } else if (data.type === 'tool_call') {
        html = `<div class="log-item">
          <span class="log-time">[${time}]</span> <span class="log-type">🛠 EXECUTING TOOL</span>
          <div class="log-tool">Tool: ${escapeHtml(data.tool_name)} | Args: ${JSON.stringify(data.args)}</div>
        </div>`;
      } else if (data.type === 'tool_result') {
        html = `<div class="log-item">
          <span class="log-time">[${time}]</span> <span class="log-type">📥 TOOL RESULT</span>
          <div style="color:#94a3b8;">${escapeHtml(data.result)}</div>
        </div>`;
      } else if (data.type === 'agent_reply') {
        html = `<div class="log-item">
          <span class="log-time">[${time}]</span> <span class="log-type">🤖 AGENT RESPONSE</span>
          <div class="log-reply">${escapeHtml(data.reply)}</div>
        </div>`;
      }

      if (html) {
        logOutput.innerHTML += html;
        logOutput.scrollTop = logOutput.scrollHeight;
      }
    };
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Boot
  loadTools();
  initLogWS();
</script>
</body>
</html>
